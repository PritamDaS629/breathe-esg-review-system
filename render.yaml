services:
  - type: web
    name: breathe-esg-prototype
    env: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm install && npm run build && cd ../backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo
    startCommand: cd backend && gunicorn breathe.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: breathe.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
